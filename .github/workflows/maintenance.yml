name: Maintenance ping

# The shared host has no crontab for this account, so an external trigger
# replaces `schedule:run` + `queue:work`. GitHub's 5-minute cron is
# best-effort (may slide a few minutes) which is acceptable here.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping maintenance endpoint
        run: |
          curl -fsS -X POST --max-time 90 \
            -H "X-Maintenance-Token: ${{ secrets.MAINTENANCE_TOKEN }}" \
            "${{ secrets.MAINTENANCE_URL }}"
