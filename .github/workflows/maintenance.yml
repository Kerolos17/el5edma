name: Maintenance ping

# Hostinger cron owns the production scheduler and queue worker. Keep this
# workflow as a manual fallback only to avoid duplicate scheduled execution.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping maintenance endpoint
        run: |
          curl -fsS -X POST --max-time 90 \
            -H "X-Maintenance-Token: ${{ secrets.MAINTENANCE_TOKEN }}" \
            "${{ secrets.MAINTENANCE_URL }}"
