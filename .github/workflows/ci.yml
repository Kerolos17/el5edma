name: CI

on:
  push:
    branches: [audit/dependency-hardening]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Resolve compatible PHP security updates
        run: |
          composer update --with-all-dependencies --no-interaction --prefer-dist
          composer validate --no-check-publish
          composer audit --locked

      - name: Persist verified Composer lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update PHP dependencies for security"
            git push origin HEAD:audit/dependency-hardening
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Copy .env
        run: cp .env.example .env

      - name: Prepare SQLite database
        run: touch database/database.sqlite

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run full test suite
        run: composer test
