name: CI

on:
  push:
    branches: [main, audit/dependency-hardening]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Trial security upgrades
        run: |
          npm install --save-exact firebase@12.19.0
          npm install --save-dev --save-exact axios@1.20.0 concurrently@9.2.4 esbuild@0.28.2 vite@7.3.6 tailwindcss@4.3.3 @tailwindcss/vite@4.3.3
          npm audit fix
          echo '=== resolved security-sensitive packages ==='
          npm ls axios concurrently shell-quote esbuild firebase @firebase/firestore @firebase/storage qrcode pngjs minimist nanoid postcss vite tailwindcss @tailwindcss/vite @tailwindcss/oxide || true
          echo '=== npm audit: production dependencies only ==='
          npm audit --omit=dev --json
          echo '=== npm audit: all dependencies ==='
          npm audit --json

      - name: Composer diagnostics
        run: composer validate --strict || true

      - name: Build frontend assets
        run: npm run build

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Copy .env
        run: cp .env.example .env

      - name: Prepare SQLite database
        run: touch database/database.sqlite

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run full test suite
        run: composer test
